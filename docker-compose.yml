# Single-host deployment. The API is NOT published to the host; only web (3000) is.
# Put an HTTPS reverse proxy / platform TLS in front of web for a public demo.
services:
  api:
    build: .
    command: ["pnpm", "--filter", "@afterhours/api", "start"]
    env_file: .env
    environment:
      API_HOST: 0.0.0.0
      DATABASE_PATH: /app/var/afterhours.sqlite
      ARTIFACTS_DIR: /app/var/artifacts
    volumes: ["afterhours-var:/app/var"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  worker:
    build: .
    command: ["pnpm", "--filter", "@afterhours/worker", "start"]
    env_file: .env
    environment:
      DATABASE_PATH: /app/var/afterhours.sqlite
      ARTIFACTS_DIR: /app/var/artifacts
    volumes: ["afterhours-var:/app/var"]
    stop_grace_period: 20s
    restart: unless-stopped
  web:
    build: .
    command: ["pnpm", "--filter", "@afterhours/web", "start"]
    env_file: .env
    environment:
      API_ORIGIN: http://api:4000
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  afterhours-var:
